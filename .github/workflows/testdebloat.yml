name: Cloud PC Edition test debloating

on:
  workflow_dispatch:
    inputs:
      use_custom_user:
        description: 'Создавать кастомного юзера? (true/false)'
        required: true
        default: 'false'
        type: boolean
      username:
        description: 'Имя кастомного юзера (если включено выше)'
        required: false
        default: 'ktoya'
        type: string

jobs:
  build-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 420

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAIL_KEY }}
      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      CUSTOM_PASS: ${{ secrets.CUSTOM_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debloater windows
        uses: Veniamin668/win-debloater-runner@main
        with:
          full_debloater: 'true'
          normal_debloater: 'false'

      - name: 1. Download Tailscale
        run: |
          Write-Host "Скачиваю Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        shell: pwsh

      - name: 2. Installing and Auth Tailscale
        run: |
          Write-Host "Устанавливаю Tailscale в тихом режиме..."
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait

          Write-Host "Запускаю Tailscale и настраиваю выходную ноду..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TAILSCALE_AUTHKEY" --unattended --advertise-exit-node

          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=== TAILSCALE IP: $tsIp ===" -ForegroundColor Green
        shell: pwsh

      - name: 3. Setup Users, Passwords & RDP
        run: |
          $useCustom = "${{ github.event.inputs.use_custom_user }}"
          $username = "${{ github.event.inputs.username }}"
          
          # Настройка встроенного администратора runneradmin через секрет ADMIN_PASS
          if (-not [string]::IsNullOrEmpty("$env:ADMIN_PASS")) {
              Write-Host "Меняю пароль для встроенного администратора runneradmin..."
              net user runneradmin "$env:ADMIN_PASS"
          }

          # Создание кастомного пользователя, если включено тумблером (с паролем из CUSTOM_PASS)
          if ($useCustom -eq 'true' -and -not [string]::IsNullOrEmpty("$username") -and -not [string]::IsNullOrEmpty("$env:CUSTOM_PASS")) {
              Write-Host "Создаю кастомного пользователя: $username..."
              $secPassword = ConvertTo-SecureString "$env:CUSTOM_PASS" -AsPlainText -Force
              New-LocalUser -Name $username -Password $secPassword -FullName "Cloud PC User" -Description "Custom Cloud PC Admin"
              Add-LocalGroupMember -Group "Administrators" -Member $username
          } else {
              Write-Host "Кастомный пользователь не требуется, работаем под runneradmin."
          }

          Write-Host "Включаем RDP в системе..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Всё готово! RDP открыт." -ForegroundColor Green
        shell: pwsh

      - name: 4. wait session (7 hours)
        run: |
          Write-Host "Cloud PC запущен и ждет тебя в сети! Не закрывай этот воркфлоу."
          while ($true) {
              Start-Sleep -Seconds 60
          }
        shell: pwsh
