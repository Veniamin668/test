name: Gentoo & SSH host

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Redirect Docker Data Root Immediately
        run: |
          echo "=== STOPPING DOCKER AND MOVING DATA-ROOT ==="
          sudo systemctl stop docker
          sudo mkdir -p /home/runner/work/docker-data
          
          # Прописываем новый data-root в конфиг демона
          sudo mkdir -p /etc/docker
          echo '{"data-root": "/home/runner/work/docker-data"}' | sudo tee /etc/docker/daemon.json
          
          sudo systemctl start docker
          echo "=== DOCKER RESTARTED ON SPACIOUS DISK ==="
          df -h

      - name: Hardcore Extra Disk Cleanup
        run: |
          sudo apt-get purge -y azure-cli google-chrome-stable microsoft-edge-stable firefox || true
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/locale/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER

      - name: Configure and Start Local SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd
          echo "root:root" | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -p 22222 &

      - name: Install Bore & Cloudflared
        run: |
          # Ставим Bore для SSH туннеля
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore && sudo mv bore /usr/local/bin/bore
          
          # Ставим Cloudflared для noVNC веб-морды
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Linux Container (Bulletproof Keep-Alive)
        run: |
          docker run -d \
            --name gentoo \
            --net host \
            --cap-add SYS_ADMIN \
            -v "${PWD:-.}/linux-data:/data" \
            gentoo/stage3:latest \
            tail -f /dev/null

      - name: Launch Tunnels (Insecure TLS Enabled)
        run: |
          echo "=== STARTING TUNNELS ==="
          # Запускаем SSH туннель
          bore local 22222 --to bore.pub &
          tail -f /dev/null
