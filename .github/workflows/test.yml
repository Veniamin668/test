name: Ultimate Windows 10 noVNC & SSH Overkill

on:
  workflow_dispatch:

jobs:
  overkill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER

      - name: Configure and Start Local SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "root:root" | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -p 22222 &

      - name: Install Bore & Cloudflared
        run: |
          # Ставим Bore для SSH туннеля
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore && sudo mv bore /usr/local/bin/bore
          
          # Ставим Cloudflared для noVNC веб-морды винды
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Windows 10 Container (Dockur)
        run: |
          docker run -d \
            --name windows \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -e "VERSION=win10" \
            -e "RAM_SIZE=12G" \
            -p 8006:8006 \
            --stop-timeout 120 \
            dockurr/windows:latest

      - name: Launch Tunnels (SSH on Bore + Windows noVNC on Cloudflare)
        run: |
          echo "=== STARTING TUNNELS ==="
          # Запускаем SSH туннель через bore.pub
          bore local 22222 --to bore.pub &
          
          # Запускаем Cloudflare туннель с принудительным http2 на noVNC порт 8006
          cloudflared tunnel --protocol http2 --url http://localhost:8006 &
          
          # Железобетонный вечный затык, чтобы раннер не закрывался
          tail -f /dev/null
