name: Ultimate SSH Overkill

on:
  workflow_dispatch:

jobs:
  ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH and Passwords
        run: |
          # Ставим сервер и настраиваем пароль
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          echo "root:root" | sudo chpasswd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config

          # Переносим SSH-сервер на порт 2222, так как 22 занят хостом
          sudo sed -i 's/#Port 22/Port 2222/' /etc/ssh/sshd_config || echo "Port 2222" | sudo tee -a /etc/ssh/sshd_config
          
          # Перезапускаем ssh с новым портом
          sudo systemctl restart ssh

      - name: Install Bore (Port Forwarder)
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

      - name: Expose SSH via Bore Tunnel
        run: |
          echo "=== SSH IS READY ON PORT 2222 ==="
          # Прокидываем именно 2222 порт наружу через bore
          bore local 2222 --to bore.pub &
          
          sleep 21600
