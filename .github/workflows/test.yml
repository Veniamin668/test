name: Cockpit Web Terminal Overkill

on:
  workflow_dispatch:

jobs:
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cockpit
        run: |
          sudo apt-get update
          sudo apt-get install -y cockpit
          
          # Задаем пароль 'root' для юзера runner и даем права sudo
          echo "runner:root" | sudo chpasswd
          sudo usermod -aG sudo runner
          
          # Жестко конфигурируем Cockpit на отказ от принудительного шифрования
          sudo mkdir -p /etc/cockpit
          echo -e "[WebService]\nAllowUnencrypted = true\n" | sudo tee /etc/cockpit/cockpit.conf
          
          # Перезапускаем сокет, чтобы настройки применились
          sudo systemctl restart cockpit.socket
          sudo systemctl restart cockpit

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Expose Cockpit via Cloudflare Tunnel
        run: |
          echo "Starting Cloudflare Quick Tunnel..."
          # Принудительно заворачиваем трафик по незашифрованному протоколу
          cloudflared tunnel --url http://127.0.0.1:9090 &
          
          echo "Cockpit terminal is live! Runner active for 6 hours."
          sleep 21600
