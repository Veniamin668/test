name: Enterprise GitLab Overkill

on:
  workflow_dispatch:

jobs:
  gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Disk Space
        uses: jlumbroso/free-disk-space-action@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Start GitLab Container
        run: |
          docker run --detach \
            --hostname gitlab.local \
            --publish 80:80 \
            --publish 443:443 \
            --publish 22:22 \
            --name gitlab \
            --restart always \
            gitlab/gitlab-ce:latest

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Expose GitLab via Cloudflare Tunnel
        run: |
          echo "Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --url http://localhost:80 &
          
          echo "Waiting for GitLab to boot up (this takes a few minutes)..."
          sleep 21600
