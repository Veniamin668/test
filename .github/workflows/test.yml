name: Windows Server 2025 test only

on:
  workflow_dispatch: # Чтобы пинать вручную с мобилки/ПК
  repository_dispatch:
    types: [trigger-next-run] # Чтобы ловить автоматический пинок от прошлого ранера

jobs:
  overkill:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Veniamin668'
    timeout-minutes: 360

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # [ШАГ АВТОМАТИЗАЦИИ 1]: Скачиваем зашифрованный бэкап диска и загрузчика из прошлой сессии
      - name: Download Previous Disk Image
        uses: actions/download-artifact@v4
        with:
          name: windows-disk-backup
          path: ./windows
        continue-on-error: true # Если это первый запуск и бэкапа ещё нет, идем дальше

      # [ШАГ АВТОМАТИЗАЦИИ 2]: Расшифровываем и восстанавливаем data.img и boot.img
      - name: Decrypt and Restore Compressed Disk Image
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils openssl
          
          # Проверяем, есть ли скачанный зашифрованный файл диска
          if [ -f ./windows/windows_compressed.qcow2.enc ]; then
            echo "=== ШИФРОВАННЫЙ БЭКАП ДИСКА НАЙДЕН, РАСШИФРОВЫВАЕМ... ==="
            openssl enc -d -aes-256-cbc -salt -in ./windows/windows_compressed.qcow2.enc -out ./windows/windows_compressed.qcow2 -k "${{ secrets.DISK_ENCRYPTION_KEY }}"
            qemu-img convert -O qcow2 ./windows/windows_compressed.qcow2 ./windows/data.img
            rm -f ./windows/windows_compressed.qcow2.enc ./windows/windows_compressed.qcow2
            echo "=== ДИСК УСПЕШНО РАСШИФРОВАН И ВОССТАНОВЛЕН В DATA.IMG! ==="
          else
            echo "=== БЭКАП ДИСКА НЕ НАЙДЕН, БУДЕТ ЧИСТАЯ УСТАНОВКА ==="
          fi

          # Если есть бэкап загрузчика, распаковываем его
          if [ -f ./windows/boot_backup.tar.gz ]; then
            echo "=== ВОССТАНАВЛИВАЕМ BOOT.IMG ==="
            tar -xzf ./windows/boot_backup.tar.gz -C ./windows
            rm -f ./windows/boot_backup.tar.gz
          fi

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER

      - name: Configure and Start Local SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd qemu-utils
          echo "root:root" | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -p 22222 &

      - name: Install Bore & Cloudflared
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore && sudo mv bore /usr/local/bin/bore
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Windows Container
        run: |
          docker run -d \
            --name windows \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -e "VERSION=2025" \
            -e "RAM_SIZE=12G" \
            -e "MANUAL=Y" \
            -p 8006:8006 \
            -v "${PWD:-.}/windows:/storage" \
            --stop-timeout 120 \
            docker.io/dockurr/windows

      - name: Wait for Windows noVNC Port to Open
        run: |
          echo "=== WAITING FOR PORT 8006 TO BE READY ==="
          while ! nc -z localhost 8006; do
            sleep 5
            echo "Port 8006 is not open yet, waiting..."
          done
          echo "=== PORT 8006 IS UP AND RUNNING! ==="

      - name: Launch Tunnels (Insecure TLS Enabled)
        run: |
          echo "=== STARTING TUNNELS ==="
          bore local 22222 --to bore.pub &
          cloudflared tunnel --no-tls-verify --url http://localhost:8006 &
      
      - name: Keep Alive Window (5 Hours 35 Minutes)
        run: |
          echo "=== СЕРВЕР АКТИВЕН И ДОСТУПЕН НА 5 ЧАСОВ 35 МИНУТ ==="
          sleep 20100

      - name: Graceful Shutdown Windows Container
        run: |
          echo "=== ВЕЖЛИВО ОСТАНАВЛИВАЕМ WINDOWS ДЛЯ СОХРАНЕНИЯ ДАННЫХ ==="
          docker stop --time 120 windows

      - name: Compress and Encrypt Disk Image for Backup
        run: |
          echo "=== ЗАПУСКАЕМ СВЕРХБЫСТРОЕ СЖАТИЕ И ШИФРОВАНИЕ ДИСКА ==="
          
          TARGET_DISK="${DISK_PATH:-./windows/data.img}"
          
          if [ -f "$TARGET_DISK" ]; then
            sudo qemu-img convert -c -O qcow2 "$TARGET_DISK" ./windows/windows_compressed.qcow2
          else
            echo "Диск не найден по пути $TARGET_DISK, пробуем стандартный ./windows/data.img"
            sudo qemu-img convert -c -O qcow2 ./windows/data.img ./windows/windows_compressed.qcow2
          fi
          
          # Шифруем сжатый диск через AES-256 (тут тоже можно под судо, чтобы файл с правами рута создался)
          sudo openssl enc -aes-256-cbc -salt -in ./windows/windows_compressed.qcow2 -out ./windows/windows_compressed.qcow2.enc -k "${{ secrets.DISK_ENCRYPTION_KEY }}"
          
          # Упаковываем boot.img в архив, если он существует в папке windows
          if [ -f ./windows/boot.img ]; then
            echo "=== УПАКОВЫВАЕМ BOOT.IMG ==="
            sudo tar -czf ./windows/boot_backup.tar.gz -C ./windows boot.img
          fi
          
          # Удаляем тяжелые открытые файлы перед загрузкой артефактов
          sudo rm -f ./windows/data.img
          sudo rm -f ./windows/windows.qcow2
          sudo rm -f ./windows/windows_compressed.qcow2

      - name: Upload Encrypted Disk to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-disk-backup
          path: |
            ./windows/windows_compressed.qcow2.enc
            ./windows/boot_backup.tar.gz
          retention-days: 2 # Храним два дня
