name: Cloud PC Edition test edition

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'username windows'
        required: true
        default: 'ktoya'
        type: string
      password:
        description: 'password user'
        required: true
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  build-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Download Tailscale
        run: |
          Write-Host "Скачиваю Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
        shell: pwsh

      - name: 2. Installing and Auth Tailscale
        run: |
          Write-Host "Устанавливаю Tailscale в тихом режиме..."
          Start-Process -FilePath "tailscale-setup.exe" -ArgumentList "/quiet", "/norestart" -Wait

          Write-Host "Запускаю Tailscale, настраиваю выходную ноду и локальный доступ..."
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ github.event.inputs.tailscale_authkey }}" --unattended --advertise-exit-node

          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=== TAILSCALE IP: $tsIp ===" -ForegroundColor Green
        shell: pwsh

      - name: 3. Create admin and Settings RDP
        run: |
          $username = "${{ github.event.inputs.username }}"
          $password = "${{ github.event.inputs.password }}"

          Write-Host "Создаю пользователя: $username..."
          $secPassword = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $secPassword -FullName "Cloud PC User" -Description "Custom Cloud PC Admin"

          Write-Host "Добавляю юзера в группу Администраторов..."
          Add-LocalGroupMember -Group "Administrators" -Member $username

          Write-Host "Включаем RDP в системе..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Write-Host "Всё готово! Пользователь создан, RDP открыт." -ForegroundColor Green
        shell: pwsh

      - name: 4. wait session (7 hours)
        run: |
          Write-Host "Cloud PC запущен и ждет тебя в сети! Не закрывай этот воркфлоу."
          while ($true) {
              Start-Sleep -Seconds 60
          }
        shell: pwsh
