name: Pure Terminal Overkill

on:
  workflow_dispatch:

jobs:
  terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Install ttyd
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd

      - name: Install Cloudflared
        run: |
          curl -L --output cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Start ttyd and Expose via Tunnel
        run: |
          # Запускаем ttyd под рутом, сразу прокидывая bash без всяких окон авторизации
          sudo ttyd -p 7681 bash &
          
          echo "Starting Cloudflare Quick Tunnel..."
          cloudflared tunnel --url http://127.0.0.1:7681 &
          
          echo "Terminal is live! Active for 6 hours."
          sleep 21600
