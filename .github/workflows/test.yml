name: Windows Server 2025 test only

on:
  workflow_dispatch: # Чтобы пинать вручную с мобилки/ПК
  repository_dispatch:
    types: [trigger-next-run] # Чтобы ловить автоматический пинок от прошлого ранера

jobs:
  overkill:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Veniamin668'
    timeout-minutes: 360

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # [ШАГ АВТОМАТИЗАЦИИ 1]: Скачиваем зашифрованный бэкап диска из прошлой сессии
      - name: Download Previous Disk Image
        uses: actions/download-artifact@v4
        with:
          name: windows-disk-backup
          path: ./windows
        continue-on-error: true # Если это первый запуск и бэкапа ещё нет, идем дальше

      # [ШАГ АВТОМАТИЗАЦИИ 2]: Расшифровываем и распаковываем qcow2 обратно в рабочий диск
      - name: Decrypt and Restore Compressed Disk Image
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-utils openssl
          
          # Проверяем, есть ли скачанный зашифрованный файл
          if [ -f ./windows/windows_compressed.qcow2.enc ]; then
            echo "=== ШИФРОВАННЫЙ БЭКАП НАЙДЕН, РАСШИФРОВЫВАЕМ... ==="
            
            # Расшифровываем файл с помощью ключа из GitHub Secrets
            openssl enc -d -aes-256-cbc -salt -in ./windows/windows_compressed.qcow2.enc -out ./windows/windows_compressed.qcow2 -k "${{ secrets.DISK_ENCRYPTION_KEY }}"
            
            # Конвертируем в рабочий qcow2
            qemu-img convert -O qcow2 ./windows/windows_compressed.qcow2 ./windows/windows.qcow2
            rm -f ./windows/windows_compressed.qcow2.enc ./windows/windows_compressed.qcow2
            
            echo "=== БЭКАП УСПЕШНО РАСШИФРОВАН И ВОССТАНОВЛЕН! ==="
          else
            echo "=== БЭКАП НЕ НАЙДЕН, БУДЕТ ЧИСТАЯ УСТАНОВКА ==="
          fi

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger
          sudo usermod -aG kvm $USER

      - name: Configure and Start Local SSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server netcat-openbsd qemu-utils
          echo "root:root" | sudo chpasswd
          sudo mkdir -p /var/run/sshd
          sudo sed -i 's/#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -p 22222 &

      - name: Install Bore & Cloudflared
        run: |
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod +x bore && sudo mv bore /usr/local/bin/bore
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Windows Container
        run: |
          docker run -d \
            --name windows \
            --device=/dev/kvm \
            --device=/dev/net/tun \
            --cap-add NET_ADMIN \
            -e "VERSION=2025" \
            -e "RAM_SIZE=12G" \
            -e "MANUAL=Y" \
            -p 8006:8006 \
            -v "${PWD:-.}/windows:/storage" \
            --stop-timeout 120 \
            docker.io/dockurr/windows

      - name: Wait for Windows noVNC Port to Open
        run: |
          echo "=== WAITING FOR PORT 8006 TO BE READY ==="
          while ! nc -z localhost 8006; do
            sleep 5
            echo "Port 8006 is not open yet, waiting..."
          done
          echo "=== PORT 8006 IS UP AND RUNNING! ==="

      - name: Launch Tunnels (Insecure TLS Enabled)
        run: |
          echo "=== STARTING TUNNELS ==="
          bore local 22222 --to bore.pub &
          cloudflared tunnel --no-tls-verify --url http://localhost:8006 &

      - name: Wait and Find Disk Image
        run: |
          echo "=== ЖДЕМ ПОЯВЛЕНИЯ ДИСКА ==="
          while true; do
          # Ищем файлы нужного формата по всему корню
          FOUND_FILE=$(find / -name "*.qcow2" -o -name "*.img" 2>/dev/null | head -n 1)
          if [ -n "$FOUND_FILE" ]; then
          echo "Нашли файл: $FOUND_FILE"
          # Проверяем, что файл уже не нулевой и не пустой
            if [ -s "$FOUND_FILE" ]; then
          echo "Файл на месте и не пустой! Выходим из цикла."
          echo "DISK_PATH=$FOUND_FILE" >> $GITHUB_ENV
          break
          fi
          fi
            echo "Пока тихо, ждем 10 секунд..."
          sleep 10
          done
      
      - name: Keep Alive Window (5 Hours 35 Minutes)
        run: |
          echo "=== СЕРВЕР АКТИВЕН И ДОСТУПЕН НА 5 ЧАСОВ 35 МИНУТ ==="
          sleep 20100

      - name: Graceful Shutdown Windows Container
        run: |
          echo "=== ВЕЖЛИВО ОСТАНАВЛИВАЕМ WINDOWS ДЛЯ СОХРАНЕНИЯ ДАННЫХ ==="
          docker stop --time 120 windows

      - name: Compress and Encrypt Disk Image for Backup
        run: |
          echo "=== ЗАПУСКАЕМ СВЕРХБЫСТРОЕ СЖАТИЕ И ШИФРОВАНИЕ ДИСКА ==="
          
          # Сжимаем qcow2
          qemu-img convert -c -O qcow2 ./windows/data.qcow2 ./windows/windows_compressed.qcow2
          
          # Шифруем полученный архив с помощью AES-256 и ключа из секретов
          openssl enc -aes-256-cbc -salt -in ./windows/windows_compressed.qcow2 -out ./windows/windows_compressed.qcow2.enc -k "${{ secrets.DISK_ENCRYPTION_KEY }}"
          
          # Удаляем тяжелые несжатые и открытые файлы
          rm -f ./windows/data.qcow2
          rm -f ./windows/windows.qcow2
          rm -f ./windows/windows_compressed.qcow2

      - name: Upload Encrypted Disk to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-disk-backup
          path: ./windows/windows_compressed.qcow2.enc
          retention-days: 2 # Храним два дня
