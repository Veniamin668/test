name: Cloud PC test auto

on:
  workflow_dispatch:
    inputs:
      use_custom_user:
        description: 'Создавать кастомного юзера? (true/false)'
        required: true
        default: 'false'
        type: boolean
      username:
        description: 'Имя кастомного юзера (если включено выше)'
        required: false
        default: 'ktoya'
        type: string

jobs:
  build-cloud-pc:
    runs-on: windows-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Win RDP Enabler
        uses: Veniamin668/win-rdp-enabler@main
        env:
         TAIL_KEY: ${{ secrets.TAIL_KEY }}
         ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
         USE_CUSTOM_USER: 'false'
         CUSTOM_USERNAME: ''
         CUSTOM_PASSWORD: ${{ secrets.CUSTOM_PASSWORD }}
         
      - name: 4. wait session (7 hours)
        run: |
          Write-Host "Cloud PC запущен и ждет тебя в сети! Не закрывай этот воркфлоу."
          while ($true) {
              Start-Sleep -Seconds 60
          }
        shell: pwsh
