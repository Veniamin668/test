name: Я ЕБУЕБУ МАКОСОСЬ

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'name custom user'
        required: true
        default: 'ktoya'
        type: string
      use_secrets:
        description: 'Использовать секреты из GitHub Secrets (true/false)'
        required: true
        default: true
        type: boolean
      manual_tail_key:
        description: 'Tailscale Key (если use_secrets: false)'
        required: false
        default: ''
        type: string
      manual_password:
        description: 'Password для пользователя (если use_secrets: false)'
        required: false
        default: ''
        type: string

jobs:
  build-cloud-pc-mac:
    runs-on: macos-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Tailscale via Homebrew
        run: |
          echo "Ставим Tailscale через brew..."
          brew install tailscale

      - name: 2. Start and Auth Tailscale
        env:
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          SECRET_KEY: ${{ secrets.TAIL_KEY }}
          MANUAL_KEY: ${{ github.event.inputs.manual_tail_key }}
        run: |
          echo "Запускаем Tailscaled сервис..."
          sudo brew services start tailscale

          if [ "$USE_SECRETS" = "true" ]; then
              ACTIVE_TAIL_KEY="$SECRET_KEY"
              echo "Используем Tailscale ключ из GitHub Secrets (TAIL_KEY)."
          else
              ACTIVE_TAIL_KEY="$MANUAL_KEY"
              echo "Используем Tailscale ключ из ручного инпута."
          fi

          echo "Авторизуемся в сети Tailscale..."
          sudo tailscale up --auth-key="$ACTIVE_TAIL_KEY" --accept-risk=all --advertise-exit-node

      - name: 3. Setup Users, SSH & Environment
        env:
          USE_SECRETS: ${{ github.event.inputs.use_secrets }}
          CUSTOM_USER: ${{ github.event.inputs.username }}
          SECRET_PASS: ${{ secrets.CUSTOM_PASSWORD }}
          MANUAL_PASS: ${{ github.event.inputs.manual_password }}
        run: |
          echo "Настраиваем пользователя $CUSTOM_USER и окружение..."

          if [ "$USE_SECRETS" = "true" ]; then
              ACTIVE_PASS="$SECRET_PASS"
              echo "Используем пароль из GitHub Secrets (CUSTOM_PASSWORD)."
          else
              ACTIVE_PASS="$MANUAL_PASS"
              echo "Используем пароль из ручного инпута."
          fi

          if ! id "$CUSTOM_USER" &>/dev/null; then
              sudo dscl . -create /Users/$CUSTOM_USER
              sudo dscl . -create /Users/$CUSTOM_USER UserShell /bin/zsh
              sudo dscl . -create /Users/$CUSTOM_USER RealName "$CUSTOM_USER"
              sudo dscl . -create /Users/$CUSTOM_USER UniqueID 502
              sudo dscl . -create /Users/$CUSTOM_USER PrimaryGroupID 20
              sudo dscl . -create /Users/$CUSTOM_USER NFSHomeDirectory /Users/$CUSTOM_USER
              sudo mkdir -p /Users/$CUSTOM_USER
              sudo chown -R $CUSTOM_USER:staff /Users/$CUSTOM_USER
              echo "Пользователь $CUSTOM_USER создан через dscl."
          else
              echo "Пользователь $CUSTOM_USER уже существует."
          fi

          echo "$ACTIVE_PASS" | sudo dscl . -passwd /Users/$CUSTOM_USER
          sudo dseditgroup -o edit -a "$CUSTOM_USER" -t user admin || true

          echo "Проверяем статус SSH..."
          sudo launchctl list | grep sshd || true

       - name: Setup Android SDK & AVD Environment
        run: |
          echo "::group::📱 Установка и инициализация Android SDK & AVD"
          export ANDROID_HOME=$HOME/Library/Android/sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          # Качаем commandline-tools, если их нет
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            curl -s https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
            mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
            rm cmdline-tools.zip
          fi

          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          # Принимаем лицухи и ставим нужные пакеты
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "system-images;android-33;google_apis;x86_64" "build-tools;33.0.2"

          # Создаем AVD под нужный образ, раз tapflow на него ругается
          echo "no" | avdmanager create avd -n "pixel_api_33" -k "system-images;android-33;google_apis;x86_64" --force
          
          # Прописываем экспорт намертво для следующих шагов
          echo "ANDROID_HOME=$HOME/Library/Android/sdk" >> $GITHUB_ENV
          echo "$HOME/Library/Android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/Library/Android/sdk/platform-tools" >> $GITHUB_PATH
          echo "::endgroup::"

      - name: Setup Tapflow (Full Fix)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          EMAIL_SECRET: ${{ secrets.EMAIL_SECRET }}
        run: |
          echo "Ставим Node.js и Tapflow..."
          brew install node
          npm install -g tapflow
          
          echo "Фиксим пути и тулзы для iOS..."
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch || true

 
          echo "Настраиваем Android SDK пути для раннера..."
          export ANDROID_HOME=$HOME/Library/Android/sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          echo "Прогоняем неинтерактивные миграции и сетапы..."
          tapflow migrate net-filter || true
          tapflow init --tunnel tailscale
          tapflow setup ios || true
          tapflow setup android || true

          
                     echo "Запускаем tapflow в фоне..."
          nohup tapflow start > tapflow.log 2>&1 &
          echo "Tapflow успешно запущен!"
          echo "::group::🤖 Автоматическая инициализация через expect"
          brew install expect || true
          
          expect -c "
            spawn tapflow admin init
            expect \"Admin email\"
            send \"$EMAIL_SECRET\r\"
            expect \"Password\"
            send \"$ADMIN_PASS\r\"
            expect eof
          " || true
          echo "::endgroup::"

      - name: 4. Wait session (7 hours)
        run: |
          echo "Всё поднято, держим сессию..."
          while true; do
            sleep 60
          done
