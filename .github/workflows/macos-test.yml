name: Cloud PC Edition (macOS SSH)

on:
  workflow_dispatch:
    inputs:
      use_custom_user:
        description: 'Создавать кастомного юзера? (true/false)'
        required: true
        default: 'false'
        type: boolean
      username:
        description: 'Имя кастомного юзера'
        required: false
        default: 'ktoya'
        type: string
      password:
        description: 'Пароль кастомного юзера'
        required: false
        default: ''
        type: string
      runner_password:
        description: 'Пароль для дефолтного runner (если пусто, не меняется)'
        required: false
        default: ''
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  build-cloud-pc-mac:
    runs-on: macos-latest
    timeout-minutes: 420

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Tailscale via Homebrew
        run: |
          echo "Ставим Tailscale через brew..."
          brew install tailscale

      - name: 2. Start and Auth Tailscale
        run: |
          echo "Запускаем Tailscaled сервис..."
          sudo brew services start tailscale
          
          echo "Авторизуемся в сети Tailscale (exit-node)..."
          sudo tailscale up --auth-key="${{ github.event.inputs.tailscale_authkey }}" --accept-risk=all --advertise-exit-node
          
          tsIp=$(tailscale ip -4)
          echo "=== TAILSCALE IP: $tsIp ==="

      - name: 3. Setup Users, SSH & Environment
        env:
          RUNNER_PASS: ${{ github.event.inputs.runner_password }}
          CUSTOM_PASS: ${{ github.event.inputs.password }}
          USE_CUSTOM: ${{ github.event.inputs.use_custom_user }}
          USERNAME: ${{ github.event.inputs.username }}
        run: |
          # Безопасная смена пароля дефолтному runner через stdin без засвета в логах
          if [ -n "$RUNNER_PASS" ]; then
              echo "Устанавливаем новый пароль для дефолтного runner..."
              sudo dscl . -passwd /Users/runner "$RUNNER_PASS" 2>/dev/null || {
                  echo -n "$RUNNER_PASS" | sudo dscl . -passwd /Users/runner
              }
          fi

          # Создаем кастомного пользователя только если включен тумблер
          if [ "$USE_CUSTOM" = "true" ] && [ -n "$USERNAME" ] && [ -n "$CUSTOM_PASS" ]; then
              echo "Создаю кастомного пользователя: $USERNAME..."
              USERID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -n 1)
              NEXTID=$((USERID + 1))
              
              sudo dscl . -create /Users/$USERNAME
              sudo dscl . -create /Users/$USERNAME UserShell /bin/zsh
              sudo dscl . -create /Users/$USERNAME RealName "$USERNAME Cloud PC"
              sudo dscl . -create /Users/$USERNAME UniqueID "$NEXTID"
              sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
              sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
              sudo mkdir -p /Users/$USERNAME
              sudo chown -R $USERNAME:staff /Users/$USERNAME
              sudo dscl . -passwd /Users/$USERNAME "$CUSTOM_PASS"
              sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          else
              echo "Кастомный юзер пропущен, используем стандартный runner."
          fi

          echo "Фиксим права на папки Homebrew..."
          sudo chown -R $USER /opt/homebrew || true
          sudo chmod -R u+w /opt/homebrew || true

          echo "Включаем SSH..."
          sudo systemsetup -setremotelogin on

          echo "Устанавливаем fastfetch..."
          brew install fastfetch

          echo "Всё готово!"

      - name: 4. Wait session (7 hours)
        continue-on-error: true
        run: |
          echo "macOS Cloud PC запущен! Ждет тебя по SSH и в сети Tailscale."
          while true; do
              sleep 60 || true
          done
