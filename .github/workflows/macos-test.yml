name: Cloud PC Edition (macOS Remote testing)

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'username macOS'
        required: true
        default: 'ktoya'
        type: string
      password:
        description: 'password user'
        required: true
        type: string
      tailscale_authkey:
        description: 'Tailscale Auth Key (tskey-auth-...)'
        required: true
        type: string

jobs:
  build-cloud-pc-mac:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Install Tailscale via Homebrew
        run: |
          echo "Ставим Tailscale через brew..."
          brew install tailscale

      - name: 2. Start and Auth Tailscale
        run: |
          echo "Запускаем Tailscaled сервис..."
          sudo brew services start tailscale
          
          echo "Авторизуемся в сети Tailscale..."
          sudo tailscale up --auth-key="${{ github.event.inputs.tailscale_authkey }}" --accept-risk=all
          
          tsIp=$(tailscale ip -4)
          echo "=== TAILSCALE IP: $tsIp ==="

      - name: 3. Create User, Fix Homebrew & Setup Environment
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          PASSWORD="${{ github.event.inputs.password }}"
          
          echo "Создаю пользователя: $USERNAME..."
          USERID=$(dscl . -list /Users UniqueID | awk '{print $2}' | sort -n | tail -n 1)
          NEXTID=$((USERID + 1))
          
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/zsh
          sudo dscl . -create /Users/$USERNAME RealName "$USERNAME Cloud PC"
          sudo dscl . -create /Users/$USERNAME UniqueID "$NEXTID"
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo mkdir -p /Users/$USERNAME
          sudo chown -R $USERNAME:staff /Users/$USERNAME
          
          echo "Устанавливаю пароль..."
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          
          echo "Добавляю юзера в группу администраторов..."
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME

          echo "Фиксим права на папки Homebrew..."
          sudo chown -R $USERNAME /opt/homebrew
          sudo chmod -R u+w /opt/homebrew

          echo "Включаем SSH..."
          sudo systemsetup -setremotelogin on

          echo "Устанавливаем fastfetch..."
          brew install fastfetch

          echo "Включаем Screen Sharing для пользователя $USERNAME..."
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users $USERNAME -privs -all -restart -agent -menu

          echo "Всё готово!"

      - name: 4. Wait session (6 hours)
        continue-on-error: true
        run: |
          echo "macOS Cloud PC запущен! Ждет тебя по SSH и в сети Tailscale."
          while true; do
              sleep 60 || true
          done
