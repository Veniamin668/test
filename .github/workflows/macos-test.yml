name: macOS Cloud PC via QEMU
on: workflow_dispatch

jobs:
  run-macos:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install QEMU, KVM and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y  qemu-utils libguestfs-tools net-tools bridge-utils xvfb openbox xterm novnc websockify

      - name: Setup Tailscale VPN
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_KEY" --accept-routes  --advertise-exit-node

          
          # Оставляем джобу активной на 7 часов
          sleep 25200
