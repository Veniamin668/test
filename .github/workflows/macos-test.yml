name: macOS Cloud PC via QEMU
on: workflow_dispatch

jobs:
  run-macos:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install QEMU, KVM and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y  qemu-utils libguestfs-tools net-tools bridge-utils

      - name: Setup Tailscale VPN
        env:
          TAILSCALE_KEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_KEY" --accept-routes  --advertise-exit-node

      - name: Download and Run Docker-OSX with GUI enabled
        run: |
          # Запускаем готовый контейнер Sickcodes, который сам создаст VNC/RDP внутри KVM      
            docker run -d \
          --device /dev/kvm \
          -p 50922:10022 \
          -v /tmp/.X11-unix:/tmp/.X11-unix \
          -e "DISPLAY=${DISPLAY:-:0.0}" \
          -e GENERATE_UNIQUE=true \
          -e CPU='Haswell-noTSX' \
          -e CPUID_FLAGS='kvm=on,vendor=GenuineIntel,+invtsc,vmware-cpuid-freq=on' \
          -e MASTER_PLIST_URL='https://raw.githubusercontent.com/sickcodes/osx-serial-generator/master/config-custom-sonoma.plist' \
          -e SHORTNAME=tahoe \
          sickcodes/docker-osx:latest
          
          # Оставляем джобу активной на 7 часов
          sleep 25200
